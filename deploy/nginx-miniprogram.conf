# nginx reverse proxy in front of a Spring Boot backend.
#
# Install to: /etc/nginx/sites-available/movie-system
#   sudo ln -sf /etc/nginx/sites-available/movie-system /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Then issue a certificate once DNS resolves:
#   sudo certbot --nginx -d api.example.cn
#
# Notes:
#  - server_name also lists the bare IP: before DNS exists, a phone preview build
#    can only reach the server by IP, and at that moment the Host header IS the IP.
#    Without it the request falls through to the default site and 404s.
#  - Large static assets are served straight off disk so they never enter the jar.
#  - The ACME challenge location must stay reachable over plain HTTP.

server {
    listen 80;
    listen [::]:80;
    server_name api.example.cn 203.0.113.10;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type "text/plain";
    }

    # ~437MB of images served straight off disk, never packaged into the jar.
    location ^~ /posters/ {
        root /opt/movie-system;
        expires 30d;
        access_log off;
        try_files $uri @backend;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # A poster missing on disk falls through to Spring, which answers with the
    # same JSON error shape the app already understands.
    location @backend {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
    }

    client_max_body_size 1024m;
}
